<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>We Stay 🤍</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    body {
      min-height:100vh; min-height:100dvh;
      background: radial-gradient(ellipse at 40% 35%, #1a1420 0%, #0c0b10 60%);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding: 40px 16px 50px;
      overflow:hidden;
      font-family:'Caveat',cursive;
    }

    /* bokeh */
    .bk {
      position:fixed; border-radius:50%;
      background:rgba(200,150,200,.12);
      filter:blur(28px); pointer-events:none;
      animation: drift ease-in-out infinite alternate;
    }
    @keyframes drift { from{transform:translate(0,0)} to{transform:translate(15px,25px)} }

    /* top eyebrow */
    .eyebrow {
      font-family:'Cormorant Garamond',serif;
      font-style:italic; font-size:.85rem;
      color:rgba(220,190,220,.35);
      letter-spacing:3px; margin-bottom:28px;
      animation:fadeIn 1s .2s ease both;
    }

    /* ring stage */
    .stage {
      position:relative;
      width:320px; height:320px;
      margin-bottom:32px;
      animation:fadeIn 1.2s .4s ease both;
    }

    /* SVG ring behind words */
    .ring-svg {
      position:absolute; inset:0;
      width:100%; height:100%;
    }

    /* center names */
    .center {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; pointer-events:none;
    }
    .heart-icon {
      font-size:1.5rem;
      display:block; margin-bottom:2px;
      animation:heartbeat 1.6s ease-in-out infinite;
      filter:drop-shadow(0 0 10px rgba(220,120,140,.6));
    }
    @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
    .center-names {
      font-family:'Great Vibes',cursive;
      font-size:clamp(1.6rem,6vw,2rem);
      color:#f5eaff;
      line-height:1.15;
      text-shadow: 0 0 30px rgba(200,150,220,.35);
    }
    .center-amp {
      font-family:'Great Vibes',cursive;
      font-size:.9rem;
      color:rgba(220,170,240,.5);
    }

    /* word labels */
    .word {
      position:absolute;
      transform:translate(-50%,-50%);
      text-align:center;
      opacity:0;
      animation:wordIn .7s ease forwards;
    }
    .word-icon { font-size:1rem; display:block; margin-bottom:2px; line-height:1; }
    .word-text {
      font-family:'Caveat',cursive;
      font-size:1rem; font-weight:700;
      color:rgba(255,255,255,.88);
      white-space:nowrap;
      text-shadow:0 2px 12px rgba(0,0,0,.8);
    }
    @keyframes wordIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

    /* bottom quote */
    .quote-wrap {
      text-align:center; max-width:340px;
      animation:fadeIn 1s 2.5s ease both; opacity:0;
    }
    .divider {
      width:48px; height:1px; margin:0 auto 14px;
      background:linear-gradient(90deg,transparent,rgba(200,150,220,.4),transparent);
    }
    .quote {
      font-family:'Cormorant Garamond',serif;
      font-style:italic; font-size:1rem;
      color:rgba(220,195,240,.55);
      line-height:1.9; letter-spacing:.3px;
    }
    .quote strong { color:rgba(240,215,255,.75); font-weight:400; }

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>

<!-- bokeh balls -->
<div id="bkWrap"></div>

<p class="eyebrow">✦ &nbsp; Adhya &amp; Sourabh &nbsp; ✦</p>

<div class="stage" id="stage">
  <!-- SVG: circle + arrows drawn by JS -->
  <svg class="ring-svg" id="ringsvg" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg"></svg>

  <!-- Center -->
  <div class="center">
    <span class="heart-icon">🤍</span>
    <div class="center-names">
      Adhya<br>
      <span class="center-amp">&amp;</span><br>
      Sourabh
    </div>
  </div>
</div>

<div class="quote-wrap">
  <div class="divider"></div>
  <p class="quote">
    "We are not perfect.<br>
    We <strong>fight</strong>, we <strong>talk</strong>, we <strong>listen</strong>.<br>
    But at the end of every storm —<br>
    <strong>we stay.</strong><br>
    And that is everything." 🤍
  </p>
</div>

<script>
var WORDS = [
  { text:"We fight",  icon:"⚡", color:"rgba(255,200,80,.85)"  },
  { text:"We talk",   icon:"💬", color:"rgba(150,200,255,.85)" },
  { text:"We listen", icon:"🤍", color:"rgba(220,170,255,.85)" },
  { text:"We stay",   icon:"∞",  color:"rgba(255,180,180,.85)" },
  { text:"We smile",  icon:"🌸", color:"rgba(180,240,180,.85)" },
  { text:"We love",   icon:"❤",  color:"rgba(255,140,160,.85)" },
];

var CX = 160, CY = 160, R = 118;
var N = WORDS.length;
var stage = document.getElementById("stage");
var svg   = document.getElementById("ringsvg");
var NS = "http://www.w3.org/2000/svg";

/* ── SVG defs: arrowhead marker ── */
var defs = document.createElementNS(NS,"defs");

/* marching-ant circle */
var circleEl = document.createElementNS(NS,"circle");
circleEl.setAttribute("cx",CX); circleEl.setAttribute("cy",CY);
circleEl.setAttribute("r",R);
circleEl.setAttribute("fill","none");
circleEl.setAttribute("stroke","rgba(255,255,255,0.12)");
circleEl.setAttribute("stroke-width","1.5");
circleEl.setAttribute("stroke-dasharray","6 5");
var marchAnim = document.createElementNS(NS,"animateTransform");
marchAnim.setAttribute("attributeName","transform");
marchAnim.setAttribute("type","rotate");
marchAnim.setAttribute("from","0 "+CX+" "+CY);
marchAnim.setAttribute("to","360 "+CX+" "+CY);
marchAnim.setAttribute("dur","90s");
marchAnim.setAttribute("repeatCount","indefinite");
circleEl.appendChild(marchAnim);
svg.appendChild(circleEl);

/* ── positions ── */
function pos(i) {
  var angle = (i/N)*2*Math.PI - Math.PI/2;
  return { x: CX + R*Math.cos(angle), y: CY + R*Math.sin(angle), angle: angle };
}

/* ── draw arc arrows ── */
WORDS.forEach(function(_,i){
  var p1 = pos(i);
  var p2 = pos((i+1)%N);

  /* arrowhead marker per segment */
  var mid = document.createElementNS(NS,"defs");
  var mkr = document.createElementNS(NS,"marker");
  var mid_id = "arr"+i;
  mkr.setAttribute("id",mid_id);
  mkr.setAttribute("markerWidth","7"); mkr.setAttribute("markerHeight","7");
  mkr.setAttribute("refX","5"); mkr.setAttribute("refY","3");
  mkr.setAttribute("orient","auto");
  var arrow = document.createElementNS(NS,"path");
  arrow.setAttribute("d","M0,0 L6,3 L0,6 L1.5,3 Z");
  arrow.setAttribute("fill","rgba(255,255,255,0.35)");
  mkr.appendChild(arrow);
  defs.appendChild(mkr);

  /* arc path - small arc clockwise from p1 to p2 */
  var path = document.createElementNS(NS,"path");
  /* calculate a point slightly before p2 for arrowhead placement */
  var angle2 = ((i+0.88)/N)*2*Math.PI - Math.PI/2;
  var px2 = CX + R*Math.cos(angle2);
  var py2 = CY + R*Math.sin(angle2);
  var d = "M "+p1.x.toFixed(1)+","+p1.y.toFixed(1)+" A "+R+","+R+" 0 0,1 "+px2.toFixed(1)+","+py2.toFixed(1);
  path.setAttribute("d",d);
  path.setAttribute("fill","none");
  path.setAttribute("stroke","rgba(255,255,255,0.25)");
  path.setAttribute("stroke-width","1.2");
  path.setAttribute("marker-end","url(#"+mid_id+")");
  svg.appendChild(path);
});

svg.insertBefore(defs, svg.firstChild);

/* ── place word labels ── */
WORDS.forEach(function(w,i){
  var p = pos(i);
  var el = document.createElement("div");
  el.className = "word";
  el.style.left  = p.x+"px";
  el.style.top   = p.y+"px";
  el.style.animationDelay = (0.6 + i*0.22)+"s";
  el.innerHTML =
    "<span class='word-icon'>"+w.icon+"</span>"+
    "<span class='word-text' style='color:"+w.color+"'>"+w.text+"</span>";
  stage.appendChild(el);
});

/* ── bokeh ── */
var bkEl = document.getElementById("bkWrap");
var bkColors = ["rgba(180,100,220,.1)","rgba(100,180,220,.08)","rgba(220,100,150,.08)","rgba(200,200,100,.07)"];
for(var b=0;b<14;b++){
  var d=document.createElement("div");
  d.className="bk";
  var sz=30+Math.random()*100;
  d.style.cssText="width:"+sz+"px;height:"+sz+"px;"
    +"left:"+Math.random()*100+"vw;top:"+Math.random()*100+"vh;"
    +"background:"+bkColors[Math.floor(Math.random()*bkColors.length)]+";"
    +"animation-duration:"+(6+Math.random()*8)+"s;"
    +"animation-delay:"+(Math.random()*4)+"s;";
  bkEl.appendChild(d);
}
</script>
</body>
</html>
