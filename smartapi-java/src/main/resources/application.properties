# Anthropic Claude API key — set via environment variable
# export ANTHROPIC_API_KEY=sk-ant-...
anthropic.api.key=${ANTHROPIC_API_KEY}

# ── Risk manager ──────────────────────────────────────────────────────────────
# Capital at risk (in rupees). Used to calculate the max daily loss amount.
risk.capital=100000

# Maximum loss as a % of capital before trading is halted for the day.
# 1.5% of 1 lakh = ₹1,500 max daily loss.
risk.max.daily.loss.percent=1.5

# Maximum number of trades per day regardless of P&L.
risk.max.trades.per.day=3

# Minimum confidence Claude must report to allow a trade. (0.82 = 82%)
risk.min.confidence=0.82
