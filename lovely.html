<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(155deg, #fce4ec 0%, #f8e1f4 35%, #ede7f6 70%, #e8eaf6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px 48px;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    /* floating blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      animation: blobDrift ease-in-out infinite alternate;
    }
    @keyframes blobDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(20px,30px) scale(1.1); }
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeDown .7s .1s ease both;
    }
    .header .eyebrow {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(150,80,160,.45);
      margin-bottom: 6px;
      display: block;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      color: #4a1a5e;
      line-height: 1.2;
    }

    /* ── Card deck ── */
    .deck-wrap {
      position: relative;
      width: min(320px, 88vw);
      height: 390px;
      margin-bottom: 28px;
      animation: fadeUp .8s .3s ease both;
    }

    /* Background stacked cards */
    .card-shadow {
      position: absolute;
      inset: 0;
      background: white;
      border-radius: 26px;
      transition: transform .4s cubic-bezier(.22,1,.36,1);
    }
    .card-shadow.s1 {
      transform: rotate(4deg) translateY(10px);
      opacity: .5;
      z-index: 1;
    }
    .card-shadow.s2 {
      transform: rotate(-5deg) translateY(16px);
      opacity: .3;
      z-index: 0;
    }

    /* Active card */
    .card {
      position: absolute;
      inset: 0;
      background: white;
      border-radius: 26px;
      overflow: hidden;
      z-index: 3;
      box-shadow:
        0 16px 48px rgba(120,60,140,.14),
        0 4px 12px rgba(120,60,140,.08);
      transform: rotate(-1deg);
      transition: transform .15s ease;
    }
    .card:active { transform: rotate(-1deg) scale(.98); }

    /* Card accent top */
    .card-top {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background .4s ease;
    }
    .card-emoji-wrap {
      width: 72px; height: 72px;
      background: rgba(255,255,255,.55);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      animation: emojiPop .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes emojiPop {
      from { transform: scale(0) rotate(-20deg); }
      to   { transform: scale(1) rotate(0deg); }
    }

    /* Card number badge */
    .card-num {
      position: absolute;
      top: 12px; right: 14px;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,.7);
      background: rgba(0,0,0,.1);
      padding: 3px 9px;
      border-radius: 50px;
    }

    /* Card body */
    .card-body {
      padding: 22px 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: calc(100% - 110px);
    }
    .card-text {
      font-size: clamp(1.02rem, 3.5vw, 1.12rem);
      font-weight: 600;
      color: #3a1a4a;
      line-height: 1.65;
      flex: 1;
    }
    .card-sub {
      font-size: .82rem;
      font-weight: 400;
      color: rgba(120,80,140,.5);
      margin-top: 12px;
      font-style: italic;
    }

    /* Card enter/exit animations */
    .card.exit-left {
      animation: exitLeft .38s cubic-bezier(.4,0,1,1) forwards;
    }
    .card.exit-right {
      animation: exitRight .38s cubic-bezier(.4,0,1,1) forwards;
    }
    .card.enter-right {
      animation: enterRight .42s cubic-bezier(.22,1,.36,1) forwards;
    }
    .card.enter-left {
      animation: enterLeft .42s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes exitLeft  { to { transform: translateX(-110%) rotate(-8deg) scale(.9); opacity:0; } }
    @keyframes exitRight { to { transform: translateX(110%) rotate(8deg) scale(.9); opacity:0; } }
    @keyframes enterRight { from { transform: translateX(110%) rotate(8deg) scale(.9); opacity:0; } to { transform: rotate(-1deg); opacity:1; } }
    @keyframes enterLeft  { from { transform: translateX(-110%) rotate(-8deg) scale(.9); opacity:0; } to { transform: rotate(-1deg); opacity:1; } }

    /* ── Navigation ── */
    .nav-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      animation: fadeUp .7s .5s ease both;
    }
    .nav-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(150,80,180,.2);
      background: white;
      color: rgba(120,60,160,.6);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
      box-shadow: 0 4px 12px rgba(120,60,140,.1);
    }
    .nav-btn:hover {
      border-color: rgba(150,80,180,.5);
      color: rgba(120,60,160,.9);
      transform: scale(1.08);
      box-shadow: 0 6px 18px rgba(120,60,140,.18);
    }
    .nav-btn:disabled {
      opacity: .3;
      cursor: default;
      transform: none;
    }
    .counter {
      font-size: .75rem;
      font-weight: 700;
      color: rgba(120,60,160,.45);
      letter-spacing: 2px;
      min-width: 48px;
      text-align: center;
    }

    /* ── Progress dots ── */
    .dots {
      display: flex;
      gap: 6px;
      animation: fadeUp .7s .6s ease both;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(150,80,180,.18);
      transition: all .3s ease;
    }
    .dot.active {
      background: rgba(150,80,180,.7);
      transform: scale(1.3);
    }
    .dot.seen {
      background: rgba(150,80,180,.35);
    }

    /* ── Final screen ── */
    .final-screen {
      position: absolute;
      inset: 0;
      background: white;
      border-radius: 26px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      z-index: 5;
      box-shadow: 0 16px 48px rgba(120,60,140,.14);
      transform: rotate(-1deg);
    }
    .final-screen.show { display: flex; animation: finalPop .6s cubic-bezier(.22,1,.36,1) both; }
    @keyframes finalPop { from{transform:rotate(-1deg) scale(.85); opacity:0;} to{transform:rotate(-1deg) scale(1); opacity:1;} }
    .final-emoji { font-size: 3.2rem; margin-bottom: 12px; animation: spinIn .7s .1s cubic-bezier(.22,1,.36,1) both; }
    @keyframes spinIn { from{transform:rotate(-180deg) scale(0)} to{transform:rotate(0deg) scale(1)} }
    .final-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.35rem;
      color: #4a1a5e;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .final-sub {
      font-size: .88rem;
      color: rgba(120,80,140,.6);
      line-height: 1.7;
    }
    .restart-btn {
      margin-top: 20px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #ce93d8, #9fa8da);
      border: none;
      border-radius: 50px;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(150,80,180,.25);
      transition: transform .2s, box-shadow .2s;
    }
    .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(150,80,180,.35); }

    /* confetti */
    .confetti-piece {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 2px;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    @keyframes fadeUp   { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>

<!-- Background blobs -->
<div class="blob" style="width:300px;height:300px;background:rgba(252,200,220,.45);top:-80px;left:-80px;animation-duration:8s;"></div>
<div class="blob" style="width:250px;height:250px;background:rgba(220,190,250,.4);bottom:-60px;right:-60px;animation-duration:11s;animation-delay:2s;"></div>
<div class="blob" style="width:180px;height:180px;background:rgba(200,220,255,.35);top:40%;right:-40px;animation-duration:9s;animation-delay:1s;"></div>

<!-- Header -->
<div class="header">
  <span class="eyebrow">✦ a little something ✦</span>
  <h1>Reasons you're<br>my favourite person</h1>
</div>

<!-- Deck -->
<div class="deck-wrap" id="deckWrap">
  <div class="card-shadow s2"></div>
  <div class="card-shadow s1"></div>

  <div class="card" id="card">
    <div class="card-top" id="cardTop">
      <div class="card-emoji-wrap" id="cardEmoji"></div>
      <span class="card-num" id="cardNum"></span>
    </div>
    <div class="card-body">
      <p class="card-text" id="cardText"></p>
      <p class="card-sub" id="cardSub"></p>
    </div>
  </div>

  <div class="final-screen" id="finalScreen">
    <div class="final-emoji">🎀</div>
    <p class="final-title">That's all for now —<br>but the list keeps growing.</p>
    <p class="final-sub">You give me new reasons<br>every single day, Adhya. 🌸</p>
    <button class="restart-btn" id="restartBtn">read again ↺</button>
  </div>
</div>

<!-- Navigation -->
<div class="nav-row">
  <button class="nav-btn" id="prevBtn">←</button>
  <span class="counter" id="counter">1 / 10</span>
  <button class="nav-btn" id="nextBtn">→</button>
</div>

<!-- Dots -->
<div class="dots" id="dots"></div>

<script>
const cards = [
  { emoji:'🌸', bg:'#fce4ec', text:'You make even the most ordinary moments feel like something worth remembering.', sub:'every single one of them 🤍' },
  { emoji:'☀️', bg:'#fff9e0', text:'You light up every room you walk into. Honestly? It's a little unfair to everyone else.', sub:'you don't even try ✨' },
  { emoji:'🎀', bg:'#f3e5f5', text:'Somehow you manage to look cute even when you're grumpy. That should not be allowed.', sub:'it's very distracting 🙈' },
  { emoji:'💬', bg:'#e8f5e9', text:'You're the first person I want to tell when something good happens. And the first when something bad does too.', sub:'my first call, always 📞' },
  { emoji:'🫂', bg:'#e3f2fd', text:'You give the kind of hugs that make everything feel manageable. Like, immediately.', sub:'a superpower, honestly 💙' },
  { emoji:'📱', bg:'#fff3e0', text:'My favourite notification — without any competition — is when it's you.', sub:'no one else is even close 🏆' },
  { emoji:'🍀', bg:'#e8f5e9', text:'Finding you was my favourite kind of lucky. The kind you don't even know to wish for.', sub:'best accident ever 🌿' },
  { emoji:'🌙', bg:'#e8eaf6', text:'I think about you at the weirdest times. Doing dishes. Stuck in traffic. Every five minutes.', sub:'you live in my head rent-free 🏡' },
  { emoji:'✨', bg:'#fffde7', text:'There's a version of every good moment that's just a little bit better because you're in it.', sub:'you upgrade everything 💫' },
  { emoji:'💛', bg:'#fff8e1', text:'You're not just cute, Adhya. You're my favourite kind of wonderful. And I'm keeping you.', sub:'non-negotiable 🤎' },
];

let current = 0;
let animating = false;

const cardEl    = document.getElementById('card');
const cardTop   = document.getElementById('cardTop');
const cardEmoji = document.getElementById('cardEmoji');
const cardNum   = document.getElementById('cardNum');
const cardText  = document.getElementById('cardText');
const cardSub   = document.getElementById('cardSub');
const prevBtn   = document.getElementById('prevBtn');
const nextBtn   = document.getElementById('nextBtn');
const counter   = document.getElementById('counter');
const dotsEl    = document.getElementById('dots');
const finalScr  = document.getElementById('finalScreen');
const restartBtn= document.getElementById('restartBtn');

/* Build dots */
cards.forEach((_,i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  dotsEl.appendChild(d);
});

function setCard(idx, dir) {
  const c = cards[idx];
  cardTop.style.background = c.bg;
  cardEmoji.textContent = c.emoji;
  cardEmoji.style.animation = 'none';
  void cardEmoji.offsetWidth;
  cardEmoji.style.animation = 'emojiPop .5s cubic-bezier(.22,1,.36,1) both';
  cardNum.textContent = (idx+1) + ' / ' + cards.length;
  cardText.textContent = c.text;
  cardSub.textContent = c.sub;
  counter.textContent = (idx+1) + ' / ' + cards.length;
  /* dots */
  dotsEl.querySelectorAll('.dot').forEach((d,i) => {
    d.className = 'dot' + (i===idx?' active': i<idx?' seen':'');
  });
  prevBtn.disabled = idx === 0;
}

function go(dir) {
  if (animating) return;
  const next = current + dir;
  if (next < 0 || next > cards.length) return;

  if (next === cards.length) {
    /* show final */
    animating = true;
    cardEl.classList.add(dir>0 ? 'exit-left' : 'exit-right');
    setTimeout(() => {
      cardEl.style.display = 'none';
      finalScr.classList.add('show');
      confettiBurst();
      animating = false;
    }, 370);
    return;
  }

  animating = true;
  cardEl.classList.add(dir>0 ? 'exit-left' : 'exit-right');

  setTimeout(() => {
    cardEl.classList.remove('exit-left','exit-right');
    current = next;
    setCard(current, dir);
    cardEl.classList.add(dir>0 ? 'enter-right' : 'enter-left');
    setTimeout(() => {
      cardEl.classList.remove('enter-right','enter-left');
      animating = false;
    }, 420);
  }, 370);

  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', () => go(1));
prevBtn.addEventListener('click', () => go(-1));

restartBtn.addEventListener('click', () => {
  finalScr.classList.remove('show');
  cardEl.style.display = '';
  current = 0;
  setCard(0, 1);
  cardEl.classList.add('enter-right');
  setTimeout(() => cardEl.classList.remove('enter-right'), 420);
  nextBtn.disabled = false;
});

/* Swipe support */
let touchX = 0;
cardEl.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
cardEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
});

/* Confetti */
const COLORS = ['#ffb3c6','#ce93d8','#90caf9','#a5d6a7','#ffe066','#ffcc80'];
function confettiBurst() {
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `
      left:${20+Math.random()*60}%;
      top: -10px;
      background: ${COLORS[Math.floor(Math.random()*COLORS.length)]};
      border-radius: ${Math.random()>.5?'50%':'2px'};
      animation-duration: ${1.2+Math.random()*1.5}s;
      animation-delay: ${Math.random()*.5}s;
      width: ${5+Math.random()*8}px;
      height: ${5+Math.random()*8}px;
    `;
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

/* Init */
setCard(0, 1);
prevBtn.disabled = true;
</script>
</body>
</html>
