<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;min-height:100dvh;
      background:linear-gradient(155deg,#fce4ec 0%,#f3e5f5 45%,#e8eaf6 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:32px 16px 48px;
      font-family:'Nunito',system-ui,sans-serif;
      overflow:hidden;user-select:none;
    }
    .blob{position:fixed;border-radius:50%;filter:blur(55px);pointer-events:none;animation:drift ease-in-out infinite alternate;}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(18px,28px)}}

    /* header */
    .hdr{text-align:center;margin-bottom:24px;animation:fadeDown .7s .1s ease both;}
    .hdr small{font-size:.68rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(140,70,160,.45);}
    .hdr h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(1.6rem,6vw,2.1rem);color:#4a1a5e;line-height:1.2;margin-top:4px;}

    /* deck */
    .deck{position:relative;width:min(310px,86vw);height:380px;margin-bottom:26px;animation:fadeUp .8s .3s ease both;touch-action:none;cursor:grab;}
    .shadow{position:absolute;inset:0;background:#fff;border-radius:24px;}
    .shadow.s1{transform:rotate(4deg) translateY(10px);opacity:.45;z-index:1;}
    .shadow.s2{transform:rotate(-5deg) translateY(16px);opacity:.25;z-index:0;}

    /* main card */
    .card{
      position:absolute;inset:0;background:#fff;border-radius:24px;z-index:3;
      box-shadow:0 14px 44px rgba(130,60,160,.13),0 4px 10px rgba(130,60,160,.08);
      transform:rotate(-1.5deg);
      overflow:hidden;
      transition:opacity .22s ease,transform .22s ease;
    }
    .card-top{height:108px;display:flex;align-items:center;justify-content:center;position:relative;transition:background .35s;}
    .emoji-ring{width:70px;height:70px;background:rgba(255,255,255,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.3rem;box-shadow:0 4px 14px rgba(0,0,0,.08);}
    .card-num{position:absolute;top:10px;right:12px;font-size:.58rem;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.12);padding:2px 8px;border-radius:20px;}
    .card-body{padding:20px 22px 18px;display:flex;flex-direction:column;gap:10px;}
    .card-msg{font-size:clamp(.98rem,3.4vw,1.1rem);font-weight:700;color:#3a1a4a;line-height:1.6;}
    .card-hint{font-size:.8rem;font-weight:600;color:rgba(120,70,150,.45);font-style:italic;}

    /* final */
    .final{position:absolute;inset:0;background:#fff;border-radius:24px;z-index:5;
      display:none;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:28px;transform:rotate(-1.5deg);
      box-shadow:0 14px 44px rgba(130,60,160,.13);}
    .final.show{display:flex;animation:popIn .55s cubic-bezier(.22,1,.36,1) both;}
    @keyframes popIn{from{transform:rotate(-1.5deg) scale(.82);opacity:0}to{transform:rotate(-1.5deg) scale(1);opacity:1}}
    .final-ico{font-size:3rem;margin-bottom:12px;animation:spin .6s .1s cubic-bezier(.22,1,.36,1) both;}
    @keyframes spin{from{transform:rotate(-180deg) scale(0)}to{transform:rotate(0) scale(1)}}
    .final h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.3rem;color:#4a1a5e;line-height:1.4;margin-bottom:10px;}
    .final p{font-size:.88rem;font-weight:600;color:rgba(120,70,150,.55);line-height:1.7;}
    .restart{margin-top:18px;padding:10px 24px;background:linear-gradient(135deg,#ce93d8,#9fa8da);border:none;border-radius:50px;color:#fff;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(150,80,180,.25);transition:transform .2s;}
    .restart:hover{transform:translateY(-2px);}

    /* nav */
    .nav{display:flex;align-items:center;gap:14px;margin-bottom:16px;animation:fadeUp .7s .5s ease both;}
    .arr{width:46px;height:46px;border-radius:50%;border:2px solid rgba(150,80,180,.2);background:#fff;color:rgba(120,60,160,.6);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 4px 10px rgba(120,60,140,.1);}
    .arr:hover:not(:disabled){border-color:rgba(150,80,180,.5);color:rgba(120,60,160,.9);transform:scale(1.08);}
    .arr:disabled{opacity:.25;cursor:default;transform:none;}
    .cnt{font-size:.72rem;font-weight:800;color:rgba(120,60,160,.4);letter-spacing:2px;min-width:46px;text-align:center;}

    /* dots */
    .dots{display:flex;gap:6px;animation:fadeUp .7s .6s ease both;}
    .dot{width:7px;height:7px;border-radius:50%;background:rgba(150,80,180,.18);transition:all .3s;}
    .dot.active{background:rgba(150,80,180,.7);transform:scale(1.35);}
    .dot.done{background:rgba(150,80,180,.35);}

    /* confetti */
    .cp{position:fixed;pointer-events:none;animation:fall linear forwards;}
    @keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>

<div class="blob" style="width:280px;height:280px;background:rgba(252,200,220,.4);top:-70px;left:-70px;animation-duration:8s;"></div>
<div class="blob" style="width:240px;height:240px;background:rgba(216,190,248,.38);bottom:-55px;right:-55px;animation-duration:11s;animation-delay:2s;"></div>

<div class="hdr">
  <small>✦ a little something ✦</small>
  <h1>Reasons you're<br>my favourite person</h1>
</div>

<div class="deck" id="deck">
  <div class="shadow s2"></div>
  <div class="shadow s1"></div>
  <div class="card" id="card">
    <div class="card-top" id="cardTop">
      <div class="emoji-ring" id="cardEmoji"></div>
      <span class="card-num" id="cardNum"></span>
    </div>
    <div class="card-body">
      <p class="card-msg" id="cardMsg"></p>
      <p class="card-hint" id="cardHint"></p>
    </div>
  </div>
  <div class="final" id="finalScr">
    <div class="final-ico">🎀</div>
    <h2>That's all for now —<br>but the list keeps growing.</h2>
    <p>You give me new reasons<br>every single day, Adhya. 🌸</p>
    <button class="restart" id="restartBtn">read again ↺</button>
  </div>
</div>

<div class="nav">
  <button class="arr" id="prevBtn">&#8592;</button>
  <span class="cnt" id="cnt">1 / 10</span>
  <button class="arr" id="nextBtn">&#8594;</button>
</div>
<div class="dots" id="dots"></div>

<script>
var DATA = [
  {e:"🌸", bg:"#fce4ec", msg:"You make even the most ordinary moments feel like something worth remembering.", hint:"every single one of them 🤍"},
  {e:"☀️", bg:"#fff9e0", msg:"You light up every room you walk into. It is honestly a little unfair to everyone else.", hint:"you do not even try ✨"},
  {e:"🎀", bg:"#f3e5f5", msg:"Somehow you manage to look cute even when you are grumpy. That should not be allowed.", hint:"it is very distracting 🙈"},
  {e:"💬", bg:"#e8f5e9", msg:"You are the first person I want to tell when something good happens. And when something bad does too.", hint:"my first call, always 📞"},
  {e:"🫂", bg:"#e3f2fd", msg:"You give the kind of hugs that make everything feel instantly manageable.", hint:"a genuine superpower 💙"},
  {e:"📱", bg:"#fff3e0", msg:"My favourite notification — without any competition — is when it is you.", hint:"no one else is even close 🏆"},
  {e:"🍀", bg:"#e8f5e9", msg:"Finding you was my favourite kind of lucky. The kind you do not even know to wish for.", hint:"best accident ever 🌿"},
  {e:"🌙", bg:"#e8eaf6", msg:"I think about you at the weirdest times. Doing dishes. Stuck in traffic. Every five minutes.", hint:"you live rent-free up here 🏡"},
  {e:"✨", bg:"#fffde7", msg:"There is a version of every good moment that is just a little better because you are in it.", hint:"you upgrade everything 💫"},
  {e:"💛", bg:"#fff8e1", msg:"You are not just cute, Adhya. You are my favourite kind of wonderful. And I am keeping you.", hint:"non-negotiable 🤎"}
];

var cur = 0, busy = false;
var card    = document.getElementById("card");
var cardTop = document.getElementById("cardTop");
var cardEmoji = document.getElementById("cardEmoji");
var cardNum   = document.getElementById("cardNum");
var cardMsg   = document.getElementById("cardMsg");
var cardHint  = document.getElementById("cardHint");
var prevBtn   = document.getElementById("prevBtn");
var nextBtn   = document.getElementById("nextBtn");
var cntEl     = document.getElementById("cnt");
var dotsEl    = document.getElementById("dots");
var finalScr  = document.getElementById("finalScr");
var restartBtn= document.getElementById("restartBtn");
var deck      = document.getElementById("deck");

/* build dots */
DATA.forEach(function(_,i){
  var d = document.createElement("div");
  d.className = "dot";
  dotsEl.appendChild(d);
});

function render(idx) {
  var c = DATA[idx];
  cardTop.style.background = c.bg;
  cardEmoji.textContent = c.e;
  cardNum.textContent = (idx+1) + " / " + DATA.length;
  cardMsg.textContent = c.msg;
  cardHint.textContent = c.hint;
  cntEl.textContent = (idx+1) + " / " + DATA.length;
  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = false;
  /* dots */
  var dots = dotsEl.querySelectorAll(".dot");
  dots.forEach(function(d, i){
    d.className = "dot" + (i===idx?" active": i<idx?" done":"");
  });
}

function go(dir) {
  if (busy) return;
  var next = cur + dir;
  if (next < 0) return;
  busy = true;

  /* slide out */
  card.style.transition = "opacity .2s ease, transform .2s ease";
  card.style.opacity = "0";
  card.style.transform = "rotate(-1.5deg) translateX(" + (dir > 0 ? "-60px" : "60px") + ")";

  setTimeout(function() {
    if (next >= DATA.length) {
      card.style.display = "none";
      finalScr.classList.add("show");
      confetti();
      busy = false;
      return;
    }
    cur = next;
    render(cur);
    /* snap to opposite side */
    card.style.transition = "none";
    card.style.transform = "rotate(-1.5deg) translateX(" + (dir > 0 ? "60px" : "-60px") + ")";
    card.style.opacity = "0";
    /* force reflow */
    card.getBoundingClientRect();
    /* slide in */
    card.style.transition = "opacity .3s ease, transform .3s ease";
    card.style.transform = "rotate(-1.5deg)";
    card.style.opacity = "1";
    setTimeout(function(){ busy = false; }, 310);
  }, 210);
}

nextBtn.addEventListener("click", function(){ go(1); });
prevBtn.addEventListener("click", function(){ go(-1); });

restartBtn.addEventListener("click", function(){
  finalScr.classList.remove("show");
  card.style.display = "";
  card.style.transition = "none";
  card.style.opacity = "0";
  card.style.transform = "rotate(-1.5deg) translateX(60px)";
  cur = 0;
  render(0);
  card.getBoundingClientRect();
  card.style.transition = "opacity .35s ease, transform .35s ease";
  card.style.transform = "rotate(-1.5deg)";
  card.style.opacity = "1";
});

/* swipe */
var tx = 0, ty = 0, tracking = false;
deck.addEventListener("touchstart", function(e){
  tx = e.touches[0].pageX; ty = e.touches[0].pageY; tracking = true;
}, {passive:true});
deck.addEventListener("touchmove", function(e){
  if (!tracking) return;
  var dx = e.touches[0].pageX - tx;
  var dy = e.touches[0].pageY - ty;
  if (Math.abs(dx) > Math.abs(dy)) e.preventDefault();
}, {passive:false});
deck.addEventListener("touchend", function(e){
  if (!tracking) return; tracking = false;
  var dx = e.changedTouches[0].pageX - tx;
  var dy = e.changedTouches[0].pageY - ty;
  if (Math.abs(dx) > 25 && Math.abs(dx) > Math.abs(dy) * 1.2) go(dx < 0 ? 1 : -1);
}, {passive:true});
deck.addEventListener("touchcancel", function(){ tracking = false; }, {passive:true});

/* confetti */
var CC = ["#ffb3c6","#ce93d8","#90caf9","#a5d6a7","#ffe066","#ffcc80"];
function confetti(){
  for(var i=0;i<45;i++){
    (function(){
      var p = document.createElement("div");
      p.className = "cp";
      p.style.cssText = "left:"+(15+Math.random()*70)+"%;top:-8px;"
        +"background:"+CC[Math.floor(Math.random()*CC.length)]+";"
        +"border-radius:"+(Math.random()>.5?"50%":"3px")+";"
        +"width:"+(5+Math.random()*7)+"px;height:"+(5+Math.random()*7)+"px;"
        +"animation-duration:"+(1.1+Math.random()*1.6)+"s;"
        +"animation-delay:"+(Math.random()*.5)+"s;";
      document.body.appendChild(p);
      p.addEventListener("animationend", function(){ p.remove(); });
    })();
  }
}

render(0);
</script>
</body>
</html>
